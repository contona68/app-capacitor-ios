name: Build iOS IPA (Paid Apple Developer)

# فقط با Apple Developer Program (~99$/year) و secrets کامل.
# برای رایگان: از build-ipa-self-hosted.yml استفاده کنید.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive and export IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate signing secrets
        run: |
          missing=0
          for name in IOS_BUILD_CERTIFICATE_BASE64 IOS_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_KEYCHAIN_PASSWORD IOS_DEVELOPMENT_TEAM IOS_PROVISIONING_PROFILE_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "iOS device installs require Apple code signing."
            echo "See README.md → «راه‌اندازی GitHub Secrets»."
            exit 1
          fi
        env:
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}

      - name: Install npm dependencies
        run: npm ci

      - name: Sync ViewApp config and Capacitor iOS
        run: npm run sync:ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Prepare ExportOptions.plist
        run: |
          mkdir -p dist
          APP_ID="$(node -e "const c=require('./buildTools/lib/read-developer-config').readDeveloperConfig(); console.log(c.app.id)")"
          sed \
            -e "s/REPLACE_WITH_TEAM_ID/${IOS_DEVELOPMENT_TEAM}/g" \
            -e "s/com.hyperyek.app/${APP_ID}/g" \
            -e "s/REPLACE_WITH_PROFILE_NAME/${IOS_PROVISIONING_PROFILE_NAME}/g" \
            buildTools/ios/ExportOptions.plist > dist/ExportOptions.plist
          cat dist/ExportOptions.plist
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build archive and export IPA
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          SIGN_IDENTITY="${IOS_CODE_SIGN_IDENTITY:-Apple Development}"
          ARCHIVE_PATH="$RUNNER_TEMP/App.xcarchive"
          EXPORT_PATH="dist"
          mkdir -p "$EXPORT_PATH"

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist dist/ExportOptions.plist

          ls -lh "$EXPORT_PATH"

      - name: Prepare artifact name
        id: artifact
        run: |
          IPA="$(find dist -maxdepth 1 -name '*.ipa' -print -quit)"
          test -f "$IPA"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"
          NAME="hyperyek-ios-${BRANCH}-${SHORT_SHA}.ipa"
          cp "$IPA" "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "dist/${NAME}"

          {
            echo "## iOS IPA (development)"
            echo ""
            echo "**Artifact:** \`${NAME}\`"
            echo ""
            echo "### Install on a registered iPhone"
            echo "1. Download the IPA from workflow artifacts."
            echo "2. Connect the device to a Mac with Xcode, or use Apple Configurator."
            echo "3. Drag the IPA onto the device, or install via \`ios-deploy\` / internal distribution."
            echo ""
            echo "The device UDID must be included in the **development** provisioning profile."
            echo "Profile expires after ~7 days unless renewed; rebuild to refresh."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          retention-days: 30
